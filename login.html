<!doctype html>
<html lang="pt-br">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Yellow Giraffe - Cadastro</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.2.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container my-5" style="max-width:600px">
    <h1 class="yellow-titulo text-center mb-4">ENTRAR NO DASHBOARD</h1>

    <form id="formCadastro" class="form-custom">
      <input type="email"    id="email"    class="form-control mb-2" placeholder="E-mail" required>
      <input type="password" id="senha"    class="form-control mb-2" placeholder="Senha (mín. 8 caracteres)" minlength="8" required>

      <div id="msg" class="small mb-2"></div>
      <button class="btn btn-yellow w-100 py-2" type="submit">ENTRAR</button>
    </form>

    <p class="text-center mt-3"><a href="index.html" class="text-warning">← Voltar ao portal</a></p>
    <p class="text-center mt-3"><a href="cadastro.html" class="text-warning">Cadastrar um novo usuário</a></p>
    <p class="text-center mt-3"><a href="dashboard.html" class="text-warning">Ir ao dashboard (temporario)</a></p>
  </div>

  <script src="cadastro.js"></script>
</body>
</html>
